# Local M4 / 16 GB: full-precision frozen base, LoRA on last four layers.
model: models/base
train: true
fine_tune_type: lora
data: data/generated/mlx
adapter_path: models/adapters
seed: 42
num_layers: 4
batch_size: 1
iters: 300
learning_rate: 0.0002
steps_per_report: 10
steps_per_eval: 100
val_batches: 8
save_every: 100
max_seq_length: 1536
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 16.0
